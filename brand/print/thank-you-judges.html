<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Thank You Judges</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --cream: #f6eadb;
    --brown: #4a2c1d;
    --red: #f04e37;
    --yellow: #fcc12d;
    --teal: #13ad9f;
  }
  @page { size: letter landscape; margin: 0; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: #d9cfc3; }
  body {
    -webkit-print-color-adjust: exact;
    print-color-adjust: exact;
    font-family: "Nunito", "Arial Rounded MT Bold", system-ui, sans-serif;
    color: var(--brown);
  }

  .sheet {
    width: 11in;
    height: 8.5in;
    margin: 0.5in auto;
    background: var(--cream);
    position: relative;
    overflow: hidden;
    box-shadow: 0 10px 40px rgba(74, 44, 29, 0.25);
    display: grid;
    grid-template-columns: 1fr 4.3in;
    align-items: center;
    gap: 0.4in;
    padding: 0.75in 0.8in 0.75in 0.9in;
  }

  /* Soft confetti of the brand's four colours in the corners */
  .confetti { position: absolute; border-radius: 50%; }

  /* Left column */
  .wordmark { width: 3.6in; display: block; margin-left: -0.08in; }
  .kicker {
    margin-top: 0.55in;
    font-family: "Fredoka", sans-serif;
    font-weight: 600;
    font-size: 13pt;
    letter-spacing: 0.32em;
    text-transform: uppercase;
    display: flex;
    align-items: center;
    gap: 0.14in;
  }
  .kicker::before {
    content: "";
    width: 0.42in;
    height: 4px;
    border-radius: 2px;
    background: var(--red);
  }
  h1 {
    margin-top: 0.12in;
    font-family: "Fredoka", "Arial Rounded MT Bold", sans-serif;
    font-weight: 700;
    font-size: 84pt;
    line-height: 1.14;
    letter-spacing: -0.01em;
  }
  h1 .accent { color: var(--red); }
  .note {
    margin-top: 0.32in;
    max-width: 4.6in;
    font-size: 15pt;
    line-height: 1.45;
    font-weight: 500;
  }
  .sign {
    margin-top: 0.3in;
    font-family: "Fredoka", sans-serif;
    font-weight: 600;
    font-size: 15pt;
  }
  .sign span { color: var(--teal); }

  /* Right column: the QR code sits in the middle of a round table */
  .table-wrap { text-align: center; }
  .table { width: 4.3in; height: 4.3in; display: block; }
  .cta {
    margin-top: 0.1in;
    font-family: "Fredoka", sans-serif;
    font-weight: 600;
    font-size: 16pt;
    letter-spacing: 0.04em;
  }
  .url {
    margin-top: 0.04in;
    font-family: "Fredoka", sans-serif;
    font-weight: 500;
    font-size: 13pt;
    letter-spacing: 0.06em;
    opacity: 0.75;
  }

  @media print {
    html, body { background: var(--cream); }
    .sheet { margin: 0; box-shadow: none; }
  }
  @media screen and (max-width: 11.5in) {
    .sheet { zoom: 0.6; }
  }
</style>
</head>
