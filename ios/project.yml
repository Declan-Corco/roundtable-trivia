# XcodeGen spec for the roundtable iOS app. Generate the Xcode project with:
#   brew install xcodegen && xcodegen generate
# (scripts/build-ipa.sh does this for you.) The .xcodeproj is generated, so it isn't committed.
name: Roundtable
options:
  bundleIdPrefix: site.round-table
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true

settings:
  base:
    MARKETING_VERSION: "1.0.0"      # version shown in the App Store
    CURRENT_PROJECT_VERSION: "1"    # build number; bump for every TestFlight/App Store upload
    RT_SERVER_URL: "https://round-table.site"  # the server the app opens
    RT_LINK_DOMAIN: "round-table.site"         # domain whose /join links open the app (universal links)
    DEVELOPMENT_TEAM: ""            # your Apple Developer Team ID, for signed builds (or pass TEAM_ID to the script)

targets:
  Roundtable:
    type: application
    platform: iOS
    sources:
      - path: Roundtable
    settings:
      base:
        PRODUCT_NAME: Roundtable
        PRODUCT_BUNDLE_IDENTIFIER: site.round-table.app
        TARGETED_DEVICE_FAMILY: "1,2"   # iPhone and iPad (an iPad makes a good host screen)
        SWIFT_VERSION: "5.0"
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_USER_SCRIPT_SANDBOXING: YES
    info:
      path: Roundtable/Info.plist
      properties:
        CFBundleDisplayName: roundtable
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        RTServerURL: $(RT_SERVER_URL)
        NSCameraUsageDescription: Scan the QR code on the host screen to join a game.
        # roundtable://join?pin=123456 opens the app (used by the "Open in app" link on the join page)
        CFBundleURLTypes:
          - CFBundleURLName: site.round-table.app
            CFBundleURLSchemes: [roundtable]
        LSRequiresIPhoneOS: true
        ITSAppUsesNonExemptEncryption: false
        UIUserInterfaceStyle: Light
        UILaunchScreen:
          UIColorName: LaunchBackground
          UIImageName: LaunchLogo
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true  # lets a test build open a plain-http server on your LAN
    # Universal links: scanning a join QR code with the Camera opens the app directly.
    # Needs a paid Apple Developer account (signed build) and APPLE_APP_ID set on the server.
    # Unsigned builds (Sideloadly/AltStore) ignore this.
    entitlements:
      path: Roundtable/Roundtable.entitlements
      properties:
        com.apple.developer.associated-domains:
          - applinks:$(RT_LINK_DOMAIN)
    scheme: {}
