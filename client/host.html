<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#fdf9f3">
  <title>Host · roundtable</title>
  <link rel="icon" href="/favicon.svg?v=__V__" type="image/svg+xml">
  <link rel="preload" href="/fonts/fredoka.woff2?v=2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/css/style.css?v=__V__">
</head>
<body class="host">
  <header class="topbar">
    <a class="wordmark" href="/" data-wordmark>roundtable</a>
    <div class="actions">
      <button class="btn btn-small" id="fullscreen-btn" type="button">Fullscreen</button>
      <button class="btn btn-small" id="end-btn" type="button" hidden>End game</button>
    </div>
  </header>

  <!-- 1. Pick a trivia set -->
  <section class="screen" id="screen-setup">
    <div class="setup">
      <h1>Set the table</h1>
      <p class="muted">Pick a trivia set, or upload your own <code>.json</code> file.</p>
      <div class="set-grid" id="set-list"></div>
      <div class="set-errors" id="set-errors"></div>
      <div class="setup-actions">
        <input class="input" type="password" id="host-password" placeholder="Host password" autocomplete="current-password" hidden>
        <button class="btn btn-primary btn-big" id="create-btn" type="button" disabled>Open the lobby</button>
      </div>
      <p class="error" id="setup-error"></p>
    </div>
  </section>

  <!-- 2. Lobby: the table fills up as guests join -->
  <section class="screen lobby-screen" id="screen-lobby" hidden>
    <div class="lobby">
      <div class="lobby-stage">
        <div class="table-wrap" id="lobby-table">
          <div class="seats" id="lobby-seats"></div>
          <div class="tabletop">
            <span class="tt-label">Game PIN</span>
            <span class="tt-pin" id="lobby-pin"></span>
            <span class="tt-sub" id="lobby-title"></span>
          </div>
        </div>
      </div>
      <aside class="lobby-side">
        <div class="join-card">
          <img id="qr" alt="QR code to join the game">
          <div class="join-text">
            <span class="muted">Scan the code, or go to</span>
            <span class="join-url" id="join-url"></span>
            <span class="muted">and tap <strong>Join</strong></span>
          </div>
        </div>
        <div class="guest-head">
          <h2>Guest list</h2>
          <span class="player-count"><span id="player-count">0</span> seated</span>
        </div>
        <ul class="guest-list" id="player-list"></ul>
        <p class="waiting" id="waiting-msg">Waiting for the first guest…</p>
        <p class="hint" id="kick-hint" hidden>Click a name to remove that player.</p>
        <div class="controls">
          <button class="btn" id="lock-btn" type="button">Lock</button>
          <button class="btn btn-primary btn-big" id="start-btn" type="button" disabled>Start the game</button>
        </div>
      </aside>
    </div>
  </section>

  <!-- 3. "Get ready" intro -->
  <section class="screen intro" id="screen-intro" hidden>
    <div class="q-counter" id="intro-counter"></div>
    <span class="badge-double" id="intro-double" hidden>Double points!</span>
    <h1 id="intro-question"></h1>
    <div class="progress"><div id="intro-progress"></div></div>
  </section>

  <!-- 4. Question + 5. Reveal: answers sit on either side of the table -->
  <section class="screen question-screen" id="screen-question" hidden>
    <div class="q-top">
      <span class="q-counter" id="q-progress"></span>
      <h1 class="q-text" id="q-text"></h1>
      <div class="q-media" id="q-media"></div>
    </div>
    <div class="q-stage" id="q-stage">
      <div class="q-col q-left" id="q-left"></div>
      <div class="table-wrap q-table" id="q-table">
        <div class="seats" id="q-seats"></div>
        <svg class="ring" viewBox="0 0 200 200" aria-hidden="true">
          <circle class="ring-track" cx="100" cy="100" r="90" pathLength="100"/>
          <circle class="ring-fill" id="q-ring" cx="100" cy="100" r="90" pathLength="100"/>
        </svg>
        <div class="tabletop">
          <span class="tt-big" id="q-timer"></span>
          <span class="tt-sub" id="q-answered-label"></span>
        </div>
      </div>
      <div class="q-col q-right" id="q-right"></div>
    </div>
    <div class="q-foot">
      <span id="q-pin"></span>
      <button class="btn" id="q-next" type="button">Skip</button>
    </div>
  </section>

  <!-- 6. Standings: a race chart from old score to new -->
  <section class="screen" id="screen-scoreboard" hidden>
    <div class="standings">
      <div class="standings-head">
        <h1>Standings</h1>
        <span class="muted" id="score-progress"></span>
      </div>
      <ol class="race" id="score-list"></ol>
    </div>
    <button class="btn btn-primary btn-big" id="score-next" type="button">Next question</button>
  </section>

  <!-- 7. Podium -->
  <section class="screen" id="screen-final" hidden>
    <div class="final">
      <span class="tagline">Head of the table</span>
      <h1 id="final-title"></h1>
    </div>
    <div class="podium" id="podium"></div>
    <p class="runners-up" id="runners-up"></p>
    <button class="btn btn-primary btn-big" id="new-game-btn" type="button">New game</button>
  </section>

  <!-- Game ended / error -->
  <section class="screen" id="screen-ended" hidden>
    <h1 class="big-title" id="ended-msg">Game over</h1>
    <button class="btn btn-primary btn-big" id="ended-btn" type="button">Host a new game</button>
  </section>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/js/common.js?v=__V__"></script>
  <script src="/js/host.js?v=__V__"></script>
</body>
</html>
